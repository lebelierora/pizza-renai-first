<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>ピザ屋バイトと3人の常連さん（初版・再現版）</title>
    <style>
      :root{
        --ink:#2b2320;
        --paper:#fff8ef;
        --accent:#d8402a;
        --accent-dark:#a92c1a;
        --cream:#ffedd6;
        --wood:#8a5a33;
        --dialog-bg:rgba(38,26,20,.88);
      }
      *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
      html,body{ height:100%; }
      body{
        margin:0;
        font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
        color:var(--ink);
        background:#1d1410;
        overflow:hidden;
        touch-action:manipulation;
        overscroll-behavior:none;
      }
      button{ font-family:inherit; min-height:44px; cursor:pointer; touch-action:manipulation; }
      #app{
        position:fixed; inset:0;
        height:100dvh;
        max-width:860px; margin:0 auto;
        overflow:hidden;
        background:#000;
      }
      /* ---------- 背景（すべてコード描画の平たいイラスト） ---------- */
      .bg-layer{ position:absolute; inset:0; opacity:0; transition:opacity .6s ease; pointer-events:none; }
      .bg-layer.active{ opacity:1; }
      .bg-layer svg{ width:100%; height:100%; display:block; }
      /* ---------- 立ち絵 ---------- */
      #charLayer{
        position:absolute; left:0; right:0; bottom:0; top:0;
        display:flex; align-items:flex-end; justify-content:center;
        pointer-events:none;
      }
      #charFigure{
        height:min(68dvh,560px);
        max-width:88vw;
        filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));
        opacity:0; transform:translateY(14px);
        transition:opacity .35s ease, transform .35s ease;
      }
      #charFigure.show{ opacity:1; transform:translateY(0); }
      /* 透明切り抜きの立ち絵 */
      #charLayer.sprite-mode{ padding-bottom:calc(168px + env(safe-area-inset-bottom)); }
      #charFigure.sprite{
        height:auto; width:min(84vw,460px);
        filter:drop-shadow(0 14px 14px rgba(0,0,0,.4));
      }
      #charFigure.sprite img{ width:100%; height:auto; display:block; }
      /* ドット絵（ピクセルアート）立ち絵 */
      #charFigure.pixel{
        height:auto; width:min(62vw,300px);
        filter:drop-shadow(0 12px 10px rgba(0,0,0,.4));
      }
      #charFigure.pixel svg{ width:100%; height:auto; display:block; }
      .pixel-thumb{
        width:70px; height:82px; flex:none;
        margin-right:12px; display:inline-block;
      }
      .pixel-thumb svg{ width:100%; height:100%; display:block; }
      .status-hero .pixel-thumb{ width:96px; height:112px; }
      /* ---------- タイトル画面：描き外観（昼）＋広場に立つキャスト ---------- */
      #titleScreen{
        overflow:hidden; padding:0; justify-content:flex-start; align-items:stretch;
        background:#f3ddba;
      }
      .title-stage{ position:relative; width:100%; flex:1 1 auto; min-height:0; }
      .title-bg{ position:absolute; inset:0;
        /* 外観SVGを全体表示（meet）したときの余白を、空→地面の色でつなぐ */
        background:linear-gradient(180deg,#4aa3e8 0%,#9fd2f5 47%,#bfe6fa 79.4%,#7c6248 79.5%,#7c6248 100%);
      }
      .title-bg svg{ width:100%; height:100%; display:block; }
      .title-scrim-top{
        position:absolute; left:0; right:0; top:0; height:36%;
        background:linear-gradient(180deg, rgba(23,43,68,.5), rgba(23,43,68,0));
        pointer-events:none;
      }
      .title-scrim-bottom{
        position:absolute; left:0; right:0; bottom:0; height:16%;
        background:linear-gradient(0deg, rgba(59,32,14,.30), rgba(59,32,14,0));
        pointer-events:none;
      }
      .title-head{
        position:absolute; left:0; right:0; top:0;
        padding:calc(20px + env(safe-area-inset-top)) 16px 0;
        text-align:center;
      }
      .title-cast{
        position:absolute; left:0; right:0; bottom:10px; height:37%;
        display:flex; align-items:flex-end; justify-content:center;
        gap:2px; padding:0 4px;
      }
      .title-cast figure{
        margin:0; height:100%; min-width:0;
        display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
      }
      .title-cast img{
        height:calc(100% - 36px); width:auto; max-width:100%; display:block;
        filter:drop-shadow(0 8px 7px rgba(70,35,10,.4));
      }
      .title-cast figcaption{
        margin-top:5px; text-align:center; line-height:1.25;
        background:rgba(43,26,16,.72); color:#fff7ec;
        border:1.5px solid rgba(255,224,178,.75);
        border-radius:999px; padding:3px 9px 4px;
        font-size:11.5px; font-weight:800; white-space:nowrap;
      }
      .title-cast figcaption .role{ display:block; font-size:9.5px; font-weight:700; color:#ffd9a8; }
      .title-panel{
        flex:none; display:flex; flex-direction:column; align-items:center;
        padding:18px 20px calc(22px + env(safe-area-inset-bottom));
        background:linear-gradient(180deg,#f8e7c8,#ffedd6);
      }
      .repro-note{ margin:10px 0 0; font-size:11.5px; color:#a5713f; font-weight:700; }
      /* ---------- ステータスのサムネイル ---------- */
      .status-who{ display:flex; align-items:center; font-weight:700; }
      .status-thumb{
        height:86px; width:auto; margin-right:12px; display:block;
      }
      .status-hero{ display:flex; gap:4px; align-items:flex-start; padding:2px 0 12px; border-bottom:2px solid #d9c3a5; margin-bottom:6px; }
      .status-hero .status-thumb{ height:118px; }
      .status-hero-body{ min-width:0; }
      .status-hero-name{ font-weight:800; font-size:16px; color:var(--ink); margin:2px 0 5px; }
      .status-hero-name .role{ font-size:12px; color:var(--accent-dark); margin-left:6px; }
      .status-hero-prof{ font-size:13px; line-height:1.75; color:#5a4636; }
      /* ---------- 上部ボタン ---------- */
      #topBar{
        position:absolute; top:calc(8px + env(safe-area-inset-top)); right:10px;
        display:none; gap:8px; z-index:30;
      }
      #topBar.show{ display:flex; }
      .top-btn{
        border:2px solid rgba(255,255,255,.75);
        background:rgba(30,20,14,.62);
        color:#fff; font-size:14px; font-weight:700;
        border-radius:999px; padding:8px 14px; min-height:40px;
      }
      .top-btn:active{ transform:scale(.96); }
      /* ---------- 会話ウィンドウ ---------- */
      #dialog{
        position:absolute; left:10px; right:10px;
        bottom:calc(10px + env(safe-area-inset-bottom));
        background:var(--dialog-bg);
        border:2px solid rgba(255,214,170,.55);
        border-radius:14px;
        padding:30px 16px 16px;
        min-height:138px;
        color:#fff7ec;
        z-index:20;
        display:none;
        cursor:pointer;
        user-select:none;
      }
      #dialog.show{ display:block; }
      #speaker{
        position:absolute; top:-15px; left:14px;
        background:var(--accent);
        color:#fff; font-weight:800; font-size:15px;
        padding:5px 16px; border-radius:999px;
        border:2px solid #ffd9a8;
        max-width:70%;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      }
      #speaker.narration{ background:#6b5646; }
      #dialogText{
        font-size:17px; line-height:1.75; letter-spacing:.02em;
        min-height:60px; white-space:pre-wrap; word-break:break-word;
      }
      #advanceHint{
        position:absolute; right:14px; bottom:8px;
        font-size:13px; color:#ffd9a8;
        animation:bob 1.1s ease-in-out infinite;
      }
      @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(3px);} }
      @media (prefers-reduced-motion: reduce){
        #advanceHint{ animation:none; }
        .bg-layer, #charFigure{ transition:none; }
      }
      /* ---------- 選択肢 ---------- */
      #choiceLayer{
        position:absolute; inset:0; z-index:25;
        display:none; flex-direction:column; align-items:center; justify-content:center;
        gap:12px; padding:20px;
        background:rgba(20,12,8,.38);
      }
      #choiceLayer.show{ display:flex; }
      .choice-btn{
        width:min(92%,520px);
        background:var(--paper);
        border:3px solid var(--accent);
        color:var(--ink);
        font-size:16px; font-weight:700; line-height:1.5;
        border-radius:14px; padding:12px 18px;
        box-shadow:0 6px 0 var(--accent-dark);
      }
      .choice-btn:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--accent-dark); }
      /* ---------- 好感度ポップ ---------- */
      #popupLayer{ position:absolute; inset:0; pointer-events:none; z-index:40; overflow:hidden; }
      .aff-pop{
        position:absolute; left:50%; top:34%;
        transform:translate(-50%,0);
        font-size:24px; font-weight:900; color:#ff5d7a;
        text-shadow:0 2px 0 #fff, 0 0 14px rgba(255,255,255,.9);
        animation:popfloat 1.5s ease-out forwards;
        white-space:nowrap;
      }
      .aff-pop.down{ color:#7d8aa0; }
      @keyframes popfloat{
        0%{ opacity:0; transform:translate(-50%,16px) scale(.7); }
        18%{ opacity:1; transform:translate(-50%,0) scale(1.12); }
        32%{ transform:translate(-50%,-4px) scale(1); }
        75%{ opacity:1; }
        100%{ opacity:0; transform:translate(-50%,-52px) scale(1); }
      }
      @media (prefers-reduced-motion: reduce){
        .aff-pop{ animation-duration:.01s; }
      }
      /* ---------- ステータス ---------- */
      #statusModal{
        position:absolute; inset:0; z-index:50;
        display:none; align-items:center; justify-content:center;
        background:rgba(15,9,6,.55); padding:20px;
      }
      #statusModal.show{ display:flex; }
      .status-card{
        background:var(--paper); border-radius:16px; border:3px solid var(--wood);
        padding:20px 22px; width:min(92%,400px);
        max-height:calc(100dvh - 40px); overflow-y:auto;
        box-shadow:0 12px 30px rgba(0,0,0,.4);
      }
      .status-card h2{ margin:0 0 12px; font-size:18px; color:var(--accent-dark); }
      .status-row{ display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px dashed #d9c3a5; font-size:16px; }
      .status-row:last-of-type{ border-bottom:none; }
      .hearts{ color:#ff5d7a; letter-spacing:2px; font-size:17px; }
      .hearts .off{ color:#d8cfc4; }
      .status-close{
        margin-top:14px; width:100%;
        background:var(--accent); color:#fff; border:none; border-radius:10px;
        font-size:16px; font-weight:800; padding:10px;
      }
      /* ---------- タイトル / エンディング ---------- */
      .screen{
        position:absolute; inset:0; z-index:60;
        display:none; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; padding:24px 20px calc(24px + env(safe-area-inset-bottom));
      }
      .screen.show{ display:flex; }
      .game-title{
        font-size:clamp(27px,7.4vw,42px); font-weight:900; line-height:1.3;
        color:#fff; margin:4px 0 2px;
        text-shadow:0 3px 0 var(--accent-dark), 0 6px 14px rgba(120,40,10,.45);
        letter-spacing:.03em;
      }
      .game-sub{ color:#fff; font-weight:700; font-size:14px; margin:2px 0 16px; text-shadow:0 1px 5px rgba(23,43,68,.8), 0 0 12px rgba(23,43,68,.45); }
      /* ワイド画面では描き背景の屋根がサブタイトル裏に来るため、帯を付けて可読性を保つ */
      @media (min-width:701px){
        .game-sub{ display:inline-block; background:rgba(24,32,48,.42); padding:4px 16px 5px; border-radius:999px; }
      }
      .name-box{
        background:rgba(255,255,255,.92); border:3px solid var(--wood); border-radius:14px;
        padding:14px 16px; width:min(92%,360px); margin-bottom:14px;
      }
      .name-box label{ display:block; font-size:13px; font-weight:800; color:#7a3a1c; margin-bottom:6px; }
      .name-box input{
        width:100%; font-size:18px; font-family:inherit; font-weight:700; text-align:center;
        border:2px solid #d9c3a5; border-radius:10px; padding:10px; background:#fffdf8; color:var(--ink);
        min-height:48px;
      }
      .start-btn{
        background:var(--accent); color:#fff; border:none;
        font-size:20px; font-weight:900; letter-spacing:.08em;
        padding:14px 54px; border-radius:999px;
        box-shadow:0 6px 0 var(--accent-dark);
      }
      .start-btn:active{ transform:translateY(4px); box-shadow:0 2px 0 var(--accent-dark); }
      .title-note{ margin-top:16px; font-size:12.5px; color:#8a5a33; line-height:1.7; }
      /* エンディング画面は1画面固定（スクロールなし）。タイトル・まとめ文・好感度・ボタンのみ */
      #endScreen{ background:linear-gradient(180deg,#2e2440 0%,#5a3350 55%,#a8543c 100%); color:#fff7ec; overflow:hidden; justify-content:center; padding-top:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
      #endScreen .end-label{ font-size:13px; letter-spacing:.35em; color:#ffce9a; font-weight:800; }
      #endTitle{ font-size:clamp(24px,6.6vw,36px); font-weight:900; margin:10px 0 6px; line-height:1.4; }
      #endText{ font-size:15.5px; line-height:1.85; max-width:480px; white-space:pre-wrap; margin:0; }
      .end-aff{
        background:rgba(255,248,239,.12); border:2px solid rgba(255,217,168,.5);
        border-radius:14px; padding:10px 20px; margin:14px 0 16px; width:min(92%,360px);
        font-size:15px; line-height:2;
      }
      .end-aff .hearts{ font-size:15px; }
      .end-btns{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
      .end-btns button{
        border-radius:999px; font-size:16px; font-weight:800; padding:12px 26px;
        border:3px solid #ffd9a8;
      }
      #againBtn{ background:var(--accent); color:#fff; border-color:#ffd9a8; }
      #toTitleBtn{ background:transparent; color:#fff7ec; }
      @media (max-height:520px){
        #charFigure{ height:56dvh; }
        #charFigure.sprite{ height:auto; width:min(64vw,320px); }
        #charFigure.pixel{ width:min(46vw,210px); }
        #charLayer.sprite-mode{ padding-bottom:134px; }
        #dialog{ min-height:112px; padding-top:24px; }
        #dialogText{ font-size:15.5px; min-height:48px; }
        #endScreen{ padding-top:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); }
        #endTitle{ font-size:20px; margin:5px 0 3px; }
        #endText{ font-size:13px; line-height:1.6; }
        .end-aff{ padding:6px 14px; margin:8px 0 10px; font-size:13px; line-height:1.7; }
        .end-btns button{ padding:9px 20px; font-size:14px; }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <!-- 背景レイヤー（JSで描きSVGを差し込む。写真素材は使わない） -->
      <div class="bg-layer" id="bg-exterior"></div>
      <div class="bg-layer" id="bg-interior"></div>
      <div class="bg-layer" id="bg-school"></div>
      <div class="bg-layer" id="bg-night"></div>
      <div class="bg-layer" id="bg-nightin"></div>

      <div id="charLayer"><div id="charFigure"></div></div>

      <div id="topBar">
        <button class="top-btn" id="statusBtn" type="button">💗 ステータス</button>
        <button class="top-btn" id="soundBtn" type="button">♪ 音 ON</button>
      </div>

      <div id="dialog">
        <div id="speaker">　</div>
        <div id="dialogText"></div>
        <div id="advanceHint">▼</div>
      </div>

      <div id="choiceLayer"></div>
      <div id="popupLayer"></div>

      <div id="statusModal">
        <div class="status-card">
          <h2>みんなの好感度</h2>
          <div id="statusRows"></div>
          <button class="status-close" id="statusClose" type="button">閉じる</button>
        </div>
      </div>

      <!-- タイトル画面 -->
      <section class="screen show" id="titleScreen">
        <div class="title-stage">
          <div class="title-bg" id="titleBg"></div>
          <div class="title-scrim-top"></div>
          <div class="title-scrim-bottom"></div>
          <div class="title-head">
            <h1 class="game-title">ピザ屋バイトと<br />3人の常連さん</h1>
            <p class="game-sub">〜 赤いコンテナのお店で始まる、短編ラブストーリー 〜</p>
          </div>
          <div class="title-cast">
            <figure>
              <img src="assets/hero-body.png" alt="主人公の全身イラスト" />
              <figcaption id="heroCaption"><span id="heroNameLabel">あなた</span><span class="role">（主人公）</span></figcaption>
            </figure>
            <figure>
              <img src="assets/shiori-body.png" alt="朝倉栞の全身イラスト" />
              <figcaption>朝倉 栞<span class="role">（先輩）</span></figcaption>
            </figure>
            <figure>
              <img src="assets/hina-body.png" alt="小日向陽菜の全身イラスト" />
              <figcaption>小日向 陽菜<span class="role">（同級生）</span></figcaption>
            </figure>
            <figure>
              <img src="assets/tsumugi-body.png" alt="白瀬紬の全身イラスト" />
              <figcaption>白瀬 紬<span class="role">（後輩）</span></figcaption>
            </figure>
            <figure>
              <img src="assets/master-body.png" alt="店主マスターの全身イラスト" />
              <figcaption>マスター<span class="role">（店主）</span></figcaption>
            </figure>
          </div>
        </div>
        <div class="title-panel">
          <div class="name-box">
            <label for="nameInput">主人公の名前（バイトの青年）</label>
            <input id="nameInput" type="text" value="ハルト" maxlength="8" autocomplete="off" aria-label="主人公の名前" />
          </div>
          <button class="start-btn" id="startBtn" type="button">バイトをはじめる</button>
          <p class="title-note">画面タップで会話が進みます。所要時間は5〜10分ほど。<br />選択肢で3人の好感度が変わり、結末が分岐します。</p>
          <p class="repro-note">初版・再現版（背景は描きイラストのみで再現）</p>
        </div>
      </section>

      <!-- エンディング画面（カードなし：タイトル・まとめ文・好感度のみ） -->
      <section class="screen" id="endScreen">
        <div class="end-label">ENDING</div>
        <h2 id="endTitle"></h2>
        <p id="endText"></p>
        <div class="end-aff" id="endAff"></div>
        <div class="end-btns">
          <button id="againBtn" type="button">もう一度遊ぶ</button>
          <button id="toTitleBtn" type="button">タイトルに戻る</button>
        </div>
      </section>
    </main>
    <script>
      "use strict";
      /* ================= 背景SVG（すべてコード描画の平たいイラスト） ================= */
      var BG = {
        exterior:
        '<svg viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
        '<defs><linearGradient id="skyE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa3e8"/><stop offset=".6" stop-color="#9fd2f5"/><stop offset="1" stop-color="#dff2fd"/></linearGradient></defs>' +
        '<rect width="600" height="800" fill="url(#skyE)"/>' +
        '<g fill="#ffffff" opacity=".92"><ellipse cx="150" cy="100" rx="66" ry="22"/><ellipse cx="196" cy="86" rx="42" ry="18"/><ellipse cx="440" cy="70" rx="80" ry="24"/><ellipse cx="490" cy="56" rx="46" ry="18"/><ellipse cx="300" cy="168" rx="48" ry="15"/></g>' +
        '<rect x="0" y="636" width="600" height="164" fill="#7c6248"/>' +
        '<rect x="0" y="636" width="600" height="10" fill="#96795a"/>' +
        '<rect x="86" y="300" width="424" height="340" rx="10" fill="#d23c22"/>' +
        '<rect x="86" y="300" width="424" height="340" rx="10" fill="none" stroke="#a92c1a" stroke-width="5"/>' +
        '<g stroke="#b93320" stroke-width="3" opacity=".5"><line x1="150" y1="306" x2="150" y2="634"/><line x1="214" y1="306" x2="214" y2="634"/><line x1="342" y1="306" x2="342" y2="634"/><line x1="470" y1="306" x2="470" y2="634"/></g>' +
        '<rect x="68" y="274" width="460" height="28" rx="8" fill="#5d6d7e"/>' +
        '<rect x="110" y="330" width="140" height="176" rx="6" fill="#fdf6ec"/>' +
        '<ellipse cx="180" cy="398" rx="33" ry="29" fill="#ffffff" stroke="#3a3230" stroke-width="4"/>' +
        '<circle cx="168" cy="390" r="4.4" fill="#3a3230"/><circle cx="192" cy="390" r="4.4" fill="#3a3230"/>' +
        '<path d="M173 404 q7 6 14 0" stroke="#3a3230" stroke-width="3.4" fill="none" stroke-linecap="round"/>' +
        '<path d="M156 378 q-10 -15 4 -23 M204 378 q10 -15 -4 -23" stroke="#3a3230" stroke-width="5" fill="none" stroke-linecap="round"/>' +
        '<path d="M209 360 l25 -12 -4 29 z" fill="#e23b25"/>' +
        '<text x="180" y="482" text-anchor="middle" font-size="15" font-weight="bold" fill="#54443a">Pizza &amp; Sweets</text>' +

      /* BGMは単一の明るい自作ループのみ（場面別切替なし）＋ON/OFFボタン */
      var BGM_CFG = {
        chords:[
          [261.6, 329.6, 392.0], [220.0, 261.6, 329.6],
          [174.6, 220.0, 261.6], [196.0, 246.9, 293.7]
        ],
        barMs:1920, chordType:"triangle", chordVol:0.05, chordDur:1.9,

      };
      var AudioSys = {
        ctx:null, master:null, musicGain:null, on:true, timer:null, step:0, MUSIC_VOL:0.16,
        init:function(){
          if(this.ctx) return;
          try{
            var AC = window.AudioContext || window.webkitAudioContext;
            if(!AC) return;
            this.ctx = new AC();
            this.master = this.ctx.createGain(); this.master.gain.value = 0.9;
            this.master.connect(this.ctx.destination);
            this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = this.MUSIC_VOL;
            this.musicGain.connect(this.master);
          }catch(e){ this.ctx = null; }
        },
        resume:function(){
          this.init();
          if(this.ctx && this.ctx.state === "suspended"){ this.ctx.resume(); }
        },
        tone:function(freq, time, dur, type, vol, dest){
          if(!this.ctx) return;
          var o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = type || "sine"; o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, time);
          g.gain.exponentialRampToValueAtTime(vol, time + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
          o.connect(g); g.connect(dest || this.master);
          o.start(time); o.stop(time + dur + 0.05);
        },
        blip:function(){ if(this.on && this.ctx){ this.tone(660, this.ctx.currentTime, 0.07, "sine", 0.05); } },
        pop:function(good){
          if(!this.on || !this.ctx) return;
          var t = this.ctx.currentTime;
          if(good){ this.tone(880, t, 0.12, "sine", 0.09); this.tone(1318, t + 0.08, 0.18, "sine", 0.09); }
          else { this.tone(330, t, 0.14, "sine", 0.06); }
        },
        startMusic:function(){
          if(!this.ctx || this.timer) return;
          var cfg = BGM_CFG, self = this;
          this.step = 0;
          var playBar = function(){
            if(!self.ctx) return;
            var t = self.ctx.currentTime + 0.06;
            var ch = cfg.chords[self.step % cfg.chords.length];
            for(var i = 0; i < ch.length; i++){ self.tone(ch[i], t, cfg.chordDur, cfg.chordType, cfg.chordVol, self.musicGain); }
            for(var j = 0; j < cfg.arpIdx.length; j++){ self.tone(ch[cfg.arpIdx[j]] * 2, t + j * cfg.arpInterval, 0.4, "sine", cfg.arpVol, self.musicGain); }
            self.tone(ch[0] / 2, t, cfg.chordDur, "sine", cfg.bassVol, self.musicGain);
            self.step++;
          };
          playBar();
          this.timer = setInterval(playBar, cfg.barMs);
        },
        stopMusic:function(){ if(this.timer){ clearInterval(this.timer); this.timer = null; } }
      };

    normal:{ eyes:"open", mouth:"smile", brow:"normal", blush:0 },
    noapron:{ eyes:"open", mouth:"smile", brow:"normal", blush:0 },
    panic:{ eyes:"wide", mouth:"big", brow:"up", blush:0, extra:"sweat" },
    serious:{ eyes:"open", mouth:"flat", brow:"angle", blush:0 },
    shy:{ eyes:"down", mouth:"wavy", brow:"up", blush:2 },
    blush:{ eyes:"down", mouth:"wavy", brow:"up", blush:2 }
  },
  asakura: {
    normal:{ eyes:"open", mouth:"smile", brow:"normal", blush:0 },
    tease:{ eyes:"wink", mouth:"smirk", brow:"normal", blush:1 },
    serious:{ eyes:"down", mouth:"flat", brow:"worry", blush:0 },
    blush:{ eyes:"down", mouth:"smile", brow:"worry", blush:2 },
    shy:{ eyes:"down", mouth:"smile", brow:"worry", blush:2 }
  },
  hina: {
    normal:{ eyes:"open", mouth:"open", brow:"normal", blush:1 },
    excited:{ eyes:"sparkle", mouth:"big", brow:"up", blush:1, extra:"sparkle" },
    expect:{ eyes:"sparkle", mouth:"o", brow:"up", blush:1, extra:"sparkle" },
    serious:{ eyes:"open", mouth:"pout", brow:"angle", blush:0 },
    blush:{ eyes:"happy", mouth:"smile", brow:"normal", blush:2 },
    shy:{ eyes:"happy", mouth:"smile", brow:"normal", blush:2 }
  },
  aoi: {
    normal:{ eyes:"open", mouth:"tiny", brow:"normal", blush:0 },
    shy:{ eyes:"down", mouth:"wavy", brow:"worry", blush:1 },
    confused:{ eyes:"down", mouth:"wavy", brow:"worry", blush:1, extra:"sweat" },
    blush:{ eyes:"down", mouth:"tiny", brow:"worry", blush:2 },
    smile:{ eyes:"happy", mouth:"smile", brow:"normal", blush:1 }
  },
  manager: {
    normal:{ eyes:"open", mouth:"smile", brow:"normal", blush:0 },
    genki:{ eyes:"sparkle", mouth:"big", brow:"up", blush:0, extra:"sparkle" },
    craft:{ eyes:"open", mouth:"flat", brow:"angle", blush:0 },
    warm:{ eyes:"happy", mouth:"smile", brow:"normal", blush:0 }
  }
};
function exprFor(ch, ex){
  var t = EXPR_TABLE[ch];
  if(t && t[ex]) return t[ex];
  if(t && t.normal) return t.normal;
  return { eyes:"open", mouth:"smile", brow:"normal", blush:0 };
}
/* 顔の地肌（耳・輪郭）。首は各キャラ側で描く */
function faceBase(skin){
  var s = "";
  s += R(13, 22, 2, 5, skin) + R(33, 22, 2, 5, skin);
  s += R(17, 13, 14, 1, skin);
  s += R(15, 14, 18, 17, skin);
  s += R(17, 31, 14, 3, skin);
  s += R(20, 34, 8, 1, skin);
  return s;
}
/* 目・眉・口・頬。目は左 x18-20／右 x27-29、口は中央 x22-26 が基準 */
function faceParts(e, iris, browC){
  var s = "", L = 18, Rt = 27, mc = "#7c3524";
  /* 眉 */
  if(e.brow === "up"){
    s += R(L - 1, 18, 4, 1, browC) + R(Rt, 18, 4, 1, browC);
  } else if(e.brow === "angle"){
    s += R(L - 1, 19, 2, 1, browC) + R(L + 1, 20, 2, 1, browC);
    s += R(Rt + 2, 19, 2, 1, browC) + R(Rt, 20, 2, 1, browC);
  } else if(e.brow === "worry"){
    s += R(L - 1, 20, 2, 1, browC) + R(L + 1, 19, 2, 1, browC);
    s += R(Rt, 19, 2, 1, browC) + R(Rt + 2, 20, 2, 1, browC);
  } else {
    s += R(L - 1, 19, 4, 1, browC) + R(Rt, 19, 4, 1, browC);
  }
  /* 目 */
  function eyeOpen(x, sparkle){
    var o = R(x, 22, 3, 1, "#2e2019") + R(x, 23, 3, 3, iris) + R(x, 23, 1, 1, "#ffffff");
    if(sparkle) o += R(x + 2, 24, 1, 1, "#ffffff") + R(x, 25, 1, 1, "#ffffff", ".8");
    return o;
  }
  function eyeHappy(x){
    return R(x, 24, 1, 1, "#2e2019") + R(x + 1, 23, 1, 1, "#2e2019") + R(x + 2, 24, 1, 1, "#2e2019");
  }
  function eyeDown(x){
    return R(x, 24, 3, 1, "#2e2019") + R(x + 1, 25, 1, 1, iris);
  }
  function eyeWide(x){
    return R(x - 1, 21, 4, 5, "#ffffff") + R(x, 22, 2, 3, iris) + R(x, 22, 1, 1, "#ffffff");
  }
  if(e.eyes === "happy"){ s += eyeHappy(L) + eyeHappy(Rt); }
  else if(e.eyes === "down"){ s += eyeDown(L) + eyeDown(Rt); }
  else if(e.eyes === "wide"){ s += eyeWide(L) + eyeWide(Rt); }
  else if(e.eyes === "wink"){ s += eyeOpen(L, false) + R(Rt, 24, 3, 1, "#2e2019"); }
  else if(e.eyes === "sparkle"){ s += eyeOpen(L, true) + eyeOpen(Rt, true); }
  else { s += eyeOpen(L, false) + eyeOpen(Rt, false); }
  /* 鼻 */
  s += R(23, 27, 1, 1, "#d89a6a");
  /* 口 */
  if(e.mouth === "smile"){ s += R(22, 29, 1, 1, mc) + R(23, 30, 2, 1, mc) + R(25, 29, 1, 1, mc); }
  else if(e.mouth === "open"){ s += R(23, 29, 2, 2, mc) + R(23, 30, 2, 1, "#e2707a"); }
  else if(e.mouth === "big"){ s += R(22, 29, 4, 3, mc) + R(23, 31, 2, 1, "#e2707a"); }
  else if(e.mouth === "flat"){ s += R(22, 30, 4, 1, mc); }
  else if(e.mouth === "smirk"){ s += R(23, 30, 3, 1, mc) + R(26, 29, 1, 1, mc); }
  else if(e.mouth === "pout"){ s += R(23, 30, 2, 1, mc) + R(23, 29, 2, 1, mc, ".45"); }
  else if(e.mouth === "wavy"){ s += R(22, 30, 1, 1, mc) + R(23, 29, 1, 1, mc) + R(24, 30, 1, 1, mc) + R(25, 29, 1, 1, mc); }
  else if(e.mouth === "o"){ s += R(23, 29, 2, 2, mc); }
  else { s += R(23, 30, 2, 1, mc); } /* tiny */
  /* 頬 */
  if(e.blush){
    var bc = e.blush >= 2 ? "#f28ba8" : "#f6aec2";
    s += R(16, 27, 3, 1, bc, ".85") + R(17, 28, 2, 1, bc, ".85");
    s += R(29, 27, 3, 1, bc, ".85") + R(29, 28, 2, 1, bc, ".85");
  }
  /* 付属（汗・きらきら） */
  if(e.extra === "sweat"){
    s += R(37, 14, 2, 2, "#a8dcf5") + R(36, 16, 4, 3, "#a8dcf5") + R(37, 16, 1, 1, "#ffffff");
  }
  if(e.extra === "sparkle"){
    s += R(5, 13, 1, 3, "#ffd83e") + R(4, 14, 3, 1, "#ffd83e");
    s += R(42, 20, 1, 3, "#ffd83e") + R(41, 21, 3, 1, "#ffd83e");
    s += R(40, 8, 1, 2, "#ffffff") + R(39, 9, 3, 1, "#ffffff", ".0");
  }
  return s;
}
/* キャラ別ベース（髪・服・小物）＋表情で1枚のドット絵SVGを返す */
function pixelCharSVG(ch, ex){
  var e = exprFor(ch, ex), s = "";
  var skin, skinSh;
  if(ch === "hero"){
    skin = "#f6cfa8"; skinSh = "#e0aa76";
    var hair = "#6b4429", hairL = "#8a5f36";
    /* 体：白Tシャツ（＋赤エプロン） */
    s += R(21, 32, 6, 7, skinSh);
    s += R(14, 37, 20, 2, "#f4efe3") + R(11, 39, 26, 17, "#f4efe3");
    s += R(11, 39, 3, 17, "#ddd2ba") + R(34, 39, 3, 17, "#ddd2ba");
    if(ex !== "noapron"){
      s += R(18, 37, 3, 6, "#c33b26") + R(27, 37, 3, 6, "#c33b26");
      s += R(17, 42, 14, 14, "#c33b26") + R(17, 52, 14, 4, "#a92c1a");
      s += R(21, 47, 6, 1, "#a92c1a") + R(21, 47, 1, 4, "#a92c1a") + R(26, 47, 1, 4, "#a92c1a");
    }
    s += faceBase(skin);
    /* ぼさっとした茶髪：ギザギザの前髪とツンツンした毛束 */
    s += R(16, 4, 4, 2, hair) + R(22, 3, 4, 3, hair) + R(28, 4, 5, 2, hair);
    s += R(15, 6, 18, 5, hair) + R(18, 7, 6, 2, hairL);
    s += R(15, 11, 18, 2, hair);
    s += R(16, 13, 3, 2, hair) + R(21, 13, 2, 3, hair) + R(25, 13, 3, 2, hair) + R(29, 13, 2, 2, hair);
    s += R(13, 11, 3, 11, hair) + R(32, 11, 3, 11, hair);
    s += faceParts(e, "#4a2c17", hair);
  }
  else if(ch === "asakura"){
    skin = "#f8d7b8"; skinSh = "#e6b98d";
    var hairS = "#7a4a2c", hairSL = "#9c6c40", hairSD = "#5f3820";
    /* 後ろ髪：腰まで届く長い髪 */
    s += R(8, 10, 32, 40, hairS) + R(8, 50, 6, 3, hairS) + R(34, 50, 6, 3, hairS);
    s += R(10, 44, 3, 8, hairSD) + R(35, 44, 3, 8, hairSD);
    /* 体：緑カーディガン＋クリーム色トップス */
    s += R(21, 32, 6, 7, skinSh);
    s += R(13, 37, 22, 2, "#5f7d43") + R(10, 39, 28, 17, "#5f7d43");
    s += R(10, 39, 3, 17, "#4e6836") + R(35, 39, 3, 17, "#4e6836");
    s += R(19, 39, 10, 17, "#f6ecd7") + R(19, 39, 10, 2, "#efe0c2");
    /* ネックレス */
    s += R(21, 41, 1, 1, "#c9973f") + R(26, 41, 1, 1, "#c9973f") + R(23, 43, 2, 2, "#e8b93e");
    s += faceBase(skin);
    /* 前髪は斜めに流し、サイドはゆるく巻いて長く */
    s += R(16, 4, 16, 2, hairS) + R(14, 6, 20, 5, hairS) + R(18, 7, 7, 2, hairSL);
    s += R(15, 11, 18, 2, hairS) + R(15, 13, 9, 2, hairS) + R(29, 13, 4, 1, hairS);
    s += R(12, 12, 4, 26, hairS) + R(12, 38, 3, 7, hairS) + R(13, 45, 3, 4, hairS);
    s += R(32, 12, 4, 26, hairS) + R(33, 38, 3, 7, hairS) + R(32, 45, 3, 4, hairS);
    s += R(13, 20, 1, 14, hairSL) + R(34, 20, 1, 14, hairSL);
    /* 金色の小さいリボン留め（向かって右） */
    s += R(34, 9, 3, 3, "#e8b93e") + R(38, 9, 3, 3, "#e8b93e") + R(37, 10, 1, 1, "#b98424");
    s += faceParts(e, "#54301c", hairSD);
  }
  else if(ch === "hina"){
    skin = "#f6c79c"; skinSh = "#e0a06a";
    var hairH = "#c56a2e", hairHL = "#e08f42", hairHD = "#a3541f";
    /* 高いポニーテール（向かって右へ流れ落ちる） */
    s += R(31, 0, 6, 9, hairH) + R(33, 8, 7, 20, hairH) + R(34, 28, 5, 6, hairH);
    s += R(35, 10, 2, 14, hairHL);
    /* サイドのゆる巻き */
    s += R(11, 13, 5, 18, hairH) + R(12, 31, 4, 5, hairH);
    /* 体：黄色カーディガン＋白T */
    s += R(21, 32, 6, 7, skinSh);
    s += R(13, 37, 22, 2, "#f0b73e") + R(10, 39, 28, 17, "#f0b73e");
    s += R(10, 39, 3, 17, "#d99e2b") + R(35, 39, 3, 17, "#d99e2b");
    s += R(20, 39, 8, 17, "#fdfaf2");
    s += R(19, 43, 1, 1, "#8a5f36") + R(19, 48, 1, 1, "#8a5f36") + R(28, 43, 1, 1, "#8a5f36") + R(28, 48, 1, 1, "#8a5f36");
    s += faceBase(skin);
    /* 前髪＋跳ねた毛束 */
    s += R(23, 2, 2, 3, hairH);
    s += R(15, 5, 18, 6, hairH) + R(18, 6, 7, 2, hairHL);
    s += R(15, 11, 18, 2, hairH);
    s += R(17, 13, 3, 2, hairH) + R(23, 13, 2, 2, hairH) + R(28, 13, 3, 2, hairH);
    s += R(13, 11, 3, 12, hairH) + R(32, 11, 3, 8, hairH);
    /* 黄色シュシュ */
    s += R(28, 3, 7, 3, "#ffd83e") + R(29, 4, 1, 1, "#e0b62a") + R(32, 4, 1, 1, "#e0b62a");
    s += faceParts(e, "#6e3c14", hairHD);
  }
  else if(ch === "aoi"){
    skin = "#f9dcc4"; skinSh = "#eac39e";
    var hairA = "#262a40", hairAL = "#3c4260", hairAD = "#171a2a";
    /* 後ろ髪：まっすぐ長く、体の脇まで */
    s += R(7, 8, 34, 48, hairA) + R(9, 20, 2, 30, hairAL, ".5");
    /* 体：紺セーター＋白襟 */
    s += R(21, 32, 6, 7, skinSh);
    s += R(13, 37, 22, 2, "#39436a") + R(10, 39, 28, 17, "#39436a");
    s += R(10, 39, 3, 17, "#2f3757") + R(35, 39, 3, 17, "#2f3757");
    s += R(19, 37, 4, 3, "#f4f2ec") + R(25, 37, 4, 3, "#f4f2ec");
    /* 抱えたノート（スケッチブック） */
    s += R(17, 43, 14, 13, "#dcbc85") + R(17, 43, 14, 2, "#c8a568");
    s += R(18, 46, 1, 1, "#8a6a3c") + R(18, 49, 1, 1, "#8a6a3c") + R(18, 52, 1, 1, "#8a6a3c");
    s += R(21, 48, 7, 1, "#b08d55") + R(21, 51, 5, 1, "#b08d55");
    s += R(13, 44, 5, 12, "#2f3757") + R(30, 44, 5, 12, "#2f3757");
    s += R(16, 49, 2, 4, skin) + R(30, 49, 2, 4, skin);
    s += faceBase(skin);
    /* 前髪は真っ直ぐ、サイドは頬の脇をまっすぐ長く */
    s += R(16, 4, 16, 2, hairA) + R(14, 6, 20, 5, hairA) + R(18, 6, 8, 2, hairAL);
    s += R(15, 11, 18, 3, hairA);
    s += R(11, 11, 4, 34, hairA) + R(33, 11, 4, 34, hairA);
    s += R(11, 45, 4, 3, hairAD) + R(33, 45, 4, 3, hairAD);
    /* 銀色のヘアピン（向かって右） */
    s += R(33, 17, 4, 1, "#dfe5ee") + R(33, 19, 3, 1, "#c6cedd");
    s += faceParts(e, "#2c3247", hairAD);
  }
  else if(ch === "manager"){
    skin = "#eebd92"; skinSh = "#d69f68";
    /* 体：黒ポロ＋赤い柄エプロン */
    s += R(21, 32, 6, 7, skinSh);
    s += R(13, 37, 22, 2, "#2c2c31") + R(10, 39, 28, 17, "#2c2c31");
    s += R(20, 37, 8, 2, "#1f1f23");
    s += R(17, 36, 3, 6, "#7d97ab") + R(28, 36, 3, 6, "#7d97ab");
    s += R(16, 42, 16, 14, "#b8402c") + R(16, 52, 16, 4, "#9c3423");
    s += R(19, 45, 2, 2, "#d2694c") + R(26, 49, 2, 2, "#d2694c") + R(21, 52, 2, 2, "#d2694c") + R(28, 44, 2, 2, "#d2694c");
    s += faceBase(skin);
    /* 軽い無精ひげ（顎まわりの点描） */
    s += R(17, 32, 1, 1, "#9a8874", ".85") + R(20, 34, 1, 1, "#9a8874", ".85") + R(24, 35, 1, 1, "#9a8874", ".85") +
         R(28, 34, 1, 1, "#9a8874", ".85") + R(31, 32, 1, 1, "#9a8874", ".85") + R(22, 33, 1, 1, "#9a8874", ".7") + R(26, 33, 1, 1, "#9a8874", ".7");
    /* キャップの下の短い髪 */
    s += R(13, 12, 3, 9, "#2e2a28") + R(32, 12, 3, 9, "#2e2a28");
    /* バッジ付きキャップ */
    s += R(17, 2, 14, 2, "#f0e7d2") + R(14, 4, 20, 7, "#f0e7d2");
    s += R(11, 11, 26, 3, "#ddd0b0") + R(11, 13, 26, 1, "#c4b28c");
    s += R(16, 6, 3, 3, "#5b84b8") + R(17, 7, 1, 1, "#ffffff");
    s += R(28, 5, 3, 3, "#eebd45") + R(29, 6, 1, 1, "#ffffff");
    s += faceParts(e, "#2e2018", "#2e2a28");
  }
  return '<svg viewBox="0 0 48 56" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' + s + '</svg>';
}

function setChar(ch, ex){
  var layer = $("charLayer");
  if(!ch){
    charEl.classList.remove("show"); charEl.classList.remove("sprite"); charEl.classList.remove("pixel");
    layer.classList.remove("sprite-mode");
    charEl.innerHTML = ""; return;
  }
  charEl.innerHTML = pixelCharSVG(ch, ex);
  charEl.classList.remove("sprite"); charEl.classList.add("pixel");
  layer.classList.add("sprite-mode");
  charEl.classList.add("show");
}

function processNext(){
if(!state) return;
while(state.queue.length){
var step = state.queue.shift();
if(step.bg){ setBg(step.bg); continue;}
if("ch" in step){ setChar(step.ch, step.ex); continue;}
if(step.finale){ chapterCard("最終話 ― 週末の繁忙日"); continue;}
/* 最終イベント冒頭は、栞エンディングへ進み得る位置にいる場合のみ夜（帰り道の空気）。
それ以外は店内 */
if(step.finaleBg){ setBg(shioriEndingPath()? "night": "interior"); continue;}
/* 最終イベントで栞以外が選ばれたら、夜にしていた背景を店内に戻す */
if(step.bgBack){
if(nightActive()){ setBg("interior");}
continue;
}
/* 閉店後の場面：行き先に応じて背景を確定（栞エンディング=夜の外、 それ以外=夜の店内） */
if(step.endBg){
var destKey = previewEnding();
if(destKey === "asakura"){ setBg("night");}
else { setBg("nightin");}
continue;
}
if(step.ending){
var key = pickEnding();
state.currentEnding = key;
state.afterEnd = true;
var lines = ENDINGS[key].lines.slice();
for(var i = lines.length - 1; i >= 0; i--){ state.queue.unshift(lines[i]);}
continue;
}
if(step.choice){ showChoice(step.choice); return;}
if("tx" in step){ showLine(step.sp, step.tx); return;}
}
if(state.afterEnd){ showEndScreen();}
}
/* エンディングの行き先を、状態を変えずに先読みする（pickEndingと同じ判定） */
function previewEnding(){
var aff = state.aff, best = null, bestVal = -1;
["asakura","hina","aoi"].forEach(function(k){
if(aff[k] > bestVal){ bestVal = aff[k]; best = k;}
});
if(bestVal < THRESHOLD) return "normal";
return best;
}
/* 最終イベント開始時点で、栞エンディングへ進み得る位置にいるか
（最終イベントの栞の選択+1の後、栞がしきい値以上かつ首位になれる位置） */
function shioriEndingPath(){
var aff = state.aff;
return aff.asakura >= THRESHOLD - 1 && aff.asakura + 1 >= aff.hina && aff.asakura + 1 >= aff.aoi;
}
function pickEnding(){
var aff = state.aff, best = null, bestVal = -1;
["asakura","hina","aoi"].forEach(function(k){
if(aff[k] > bestVal){ bestVal = aff[k]; best = k;}
});
/* 同点の優先順位は現行踏襲（栞→陽菜→紬）。全員0の場合も通常エンドに合流 */
if(bestVal < THRESHOLD) return "normal";
return best;
}
function showChoice(options){
choiceEl.innerHTML = "";
options.forEach(function(opt){
var b = document.createElement("button");
b.type = "button"; b.className = "choice-btn"; b.textContent = opt.label;
b.addEventListener("click", function(ev){
ev.stopPropagation();
AudioSys.resume();
chooseOption(opt);
});
choiceEl.appendChild(b);
});
choiceEl.classList.add("show");
}
function chooseOption(opt){
choiceEl.classList.remove("show");
var total = 0, firstKey = null;
for(var k in opt.fx){
if(opt.fx[k]){
state.aff[k] = Math.max(0, Math.min(MAXAFF, state.aff[k] + opt.fx[k]));
total += opt.fx[k];
if(!firstKey) firstKey = k;
}
}
AudioSys.pop(total > 0);
if(firstKey){ showPopup(firstKey, opt.fx[firstKey]);}
var steps = (opt.steps || []).slice();
for(var i = steps.length - 1; i >= 0; i--){ state.queue.unshift(steps[i]);}
setTimeout(processNext, firstKey? 950: 60);
}
function advance(){
if(!state || state.busy) return;
if(choiceEl.classList.contains("show")) return;
if($("statusModal").classList.contains("show")) return;
if(typing){
if(typeTimer) clearInterval(typeTimer);
typing = false; textEl.textContent = fullText; return;
}
AudioSys.resume(); AudioSys.blip();
processNext();
}
dialogEl.addEventListener("click", function(){ advance();});
$("app").addEventListener("click", function(e){
if(!dialogEl.classList.contains("show")) return;
if(e.target.closest("button") || e.target.closest("input")) return;
if(e.target.closest("#dialog")) return;
advance();
});
document.addEventListener("keydown", function(e){
if(e.key === " " || e.key === "Enter"){
if(dialogEl.classList.contains("show") &&!$("titleScreen").classList.contains("show")){
e.preventDefault(); advance();
}
}
});
/* ---------- ステータス ---------- */
function renderStatus(){
var rows = "";
var heroName = state? state.name: "あなた";
var safeName = heroName.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
rows += '<div class="status-hero">' +
'<span class="status-thumb pixel-thumb">' + pixelCharSVG("hero", "normal") + '</span>' +
'<div class="status-hero-body"><div class="status-hero-name">' + safeName + '<span class="role">主人公</span></div>' +
'<div class="status-hero-prof">20歳｜調理専門学校 2年生<br />ピザ屋で働き始めた新入りバイト<br />ピザ作りは、まだまだ練習中<br />不器用だけど、何事にも一生懸命</div></div></div>';
["asakura","hina","aoi"].forEach(function(k){
rows += '<div class="status-row"><span class="status-who">' +
'<span class="status-thumb pixel-thumb">' + pixelCharSVG(k, "normal") + '</span>' + NAMES[k] + '</span>' +
'<span class="hearts">' + hearts(state? state.aff[k]: 0) + '</span></div>';
});
rows += '<div class="status-hero" style="border-bottom:none;border-top:2px solid #d9c3a5;margin-top:10px;padding-top:12px;margin-bottom:0;padding-bottom:2px;">' +
'<span class="status-thumb pixel-thumb">' + pixelCharSVG("manager", "normal") + '</span>' +
'<div class="status-hero-body"><div class="status-hero-name">マスター<span class="role">店主</span></div>' +
'<div class="status-hero-prof">40代、気持ちは20代！<br />赤いピザ屋の店主<br />新しいことが好きな、陽気な兄貴分<br />ピザを焼くときは、頼れる職人<br />主人公と常連たちを温かく見守る</div></div></div>';
$("statusRows").innerHTML = rows;
}
$("statusBtn").addEventListener("click", function(e){
e.stopPropagation(); AudioSys.resume(); renderStatus();
$("statusModal").classList.add("show");
});
$("statusClose").addEventListener("click", function(e){
e.stopPropagation(); $("statusModal").classList.remove("show");
});
$("statusModal").addEventListener("click", function(e){
if(e.target === this){ this.classList.remove("show");}
});
/* ---------- 音ON/OFF ---------- */
$("soundBtn").addEventListener("click", function(e){
e.stopPropagation();
AudioSys.resume();
AudioSys.on =!AudioSys.on;
this.textContent = AudioSys.on? "♪ 音 ON": "♪ 音 OFF";
if(AudioSys.on){ AudioSys.startMusic();} else { AudioSys.stopMusic();}
});
/* ---------- 開始 / 終了 ---------- */
$("nameInput").addEventListener("input", function(){
var v = this.value.trim();
$("heroNameLabel").textContent = v? v: "あなた";
});
(function(){
var v = $("nameInput").value.trim();
$("heroNameLabel").textContent = v? v: "あなた";
})();
function startGame(){
var name = $("nameInput").value.trim() || "ハルト";
state = freshState(name);
$("titleScreen").classList.remove("show");
$("endScreen").classList.remove("show");
dialogEl.classList.add("show");
$("topBar").classList.add("show");
setChar(null); setBg("exterior");
processNext();
}
function showEndScreen(){
var key = state.currentEnding || "normal";
var end = ENDINGS[key];
dialogEl.classList.remove("show");
$("topBar").classList.remove("show");
setChar(null);
$("endTitle").textContent = end.title;
$("endText").textContent = subst(end.text);
var rows = "<div>【" + end.label + "】到達</div>";
["asakura","hina","aoi"].forEach(function(k){
rows += '<div>' + NAMES[k] + ' <span class="hearts">' + hearts(state.aff[k]) + '</span> ' + state.aff[k] + '</div>';
});
$("endAff").innerHTML = rows;
$("endScreen").classList.add("show");
AudioSys.pop(true);
}
/* タイトル画面での最初のタップで、BGM（単一ループ）を開始する */
$("titleScreen").addEventListener("click", function(e){
if(e.target.closest("#startBtn")) return;
AudioSys.resume();
if(AudioSys.on) AudioSys.startMusic();
});
$("startBtn").addEventListener("click", function(){
AudioSys.resume();
startGame();
if(AudioSys.on) AudioSys.startMusic();
});
$("againBtn").addEventListener("click", function(){
AudioSys.resume();
state = freshState(state? state.name: ($("nameInput").value.trim() || "ハルト"));
$("endScreen").classList.remove("show");
dialogEl.classList.add("show");
$("topBar").classList.add("show");
setChar(null); setBg("exterior");
if(AudioSys.on) AudioSys.startMusic();
processNext();
});
$("toTitleBtn").addEventListener("click", function(){
state = null;
$("endScreen").classList.remove("show");
dialogEl.classList.remove("show");
$("topBar").classList.remove("show");
setChar(null); setBg("exterior");
$("titleScreen").classList.add("show");
AudioSys.resume();
if(AudioSys.on) AudioSys.startMusic();
});
</script>
